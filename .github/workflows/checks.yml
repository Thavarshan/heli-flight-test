name: project-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lightweight weekly regression check: Monday 08:47 Asia/Colombo (03:17 UTC).
  # GitHub schedules only run on the default branch after this PR is merged.
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python docs/scripts/check_project.py
      - run: python code/run_experiment.py --config configs/pilot.json --dry-run
      - run: python -m compileall -q code docs/scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python docs/scripts/check_submission.py

  jsbsim-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned pilot dependencies
        run: python -m pip install -r requirements-probe.txt
      - name: Run AH-1S demonstration twice and screen last window
        run: python code/probe_backend.py --seconds 45 --output smoke-output/jsbsim-probe.json
      - name: Check evidence integrity and offline metrics
        run: python docs/scripts/check_probe_report.py --report smoke-output/jsbsim-probe.json
      - name: Retain reproducible, explicitly preliminary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsbsim-preliminary-smoke
          path: smoke-output/
          retention-days: 7
          if-no-files-found: warn

  control-response-probe:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned JSBSim
        run: python -m pip install -r requirements-probe.txt
      - name: Compare fresh-instance pilot control perturbations
        run: python code/probe_control_responses.py --output smoke-output/control-responses.json
      - name: Retain exploratory control-response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-response-prevalidation
          path: smoke-output/control-responses.json
          retention-days: 7
          if-no-files-found: warn

  feedback-pilot:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-probe.txt
      - name: Run deterministic stock-script development feedback comparison
        run: python code/probe_position_hold.py --output smoke-output/position-hold-proposal.json
      - name: Preserve complete exploratory comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: position-hold-exploratory
          path: smoke-output/position-hold-proposal.json
          retention-days: 7
          if-no-files-found: warn

  timestep-probe:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSBSim pinned exploratory backend
        run: python -m pip install -r requirements-probe.txt
      - name: Compare same-clock h, h/2, h/4 trajectories
        run: python code/probe_timestep.py --output smoke-output/timestep-probe.json
      - name: Preserve descriptive evidence and backend failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timestep-prevalidation
          path: smoke-output/timestep-probe.json
          retention-days: 7
          if-no-files-found: warn

  script-free-probe:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-probe.txt
      - name: Test independently loaded AH-1S without any stock flight script
        run: python code/probe_scriptfree.py --output smoke-output/scriptfree.json
      - name: Preserve negative and unresolved observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scriptfree-prevalidation
          path: smoke-output/scriptfree.json
          retention-days: 7
          if-no-files-found: warn

  sfd-seed-screen:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-probe.txt
      - name: Investigate SFD-inspired script-free steady-start candidates
        run: python code/probe_hover_seed.py --output smoke-output/sfd-seeds.json
      - name: Preserve all cases including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfd-seed-prevalidation
          path: smoke-output/sfd-seeds.json
          retention-days: 7
          if-no-files-found: warn

  extended-hover-seed:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-probe.txt
      - name: Verify 45s candidate, fresh replay and h/h2/h4 screen
        run: python code/probe_seed_extended.py --output smoke-output/extended-seed.json
      - name: Save both successful and negative candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-hover-seed-prevalidation
          path: smoke-output/extended-seed.json
          retention-days: 7
          if-no-files-found: warn

  jsbsim-native-trim-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-probe.txt
      - name: Attempt official full and longitudinal trim without flight script
        run: python code/probe_native_trim.py --output smoke-output/native-trim.json
      - name: Retain failed trims and post-trim trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsbsim-native-trim-gate
          path: smoke-output/native-trim.json
          retention-days: 7
          if-no-files-found: warn

  ardupilot-heli-sitl-smoke:
    # Historical generic Copter mismatch test: not the accepted heli backend.
    # Explicit/manual only; no wasted 135s pre-arm probe on every commit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned MAVLink test library
        run: python -m pip install pymavlink==2.4.50
      - name: Get official stable Linux x86-64 SITL executable and upstream heli defaults
        run: |
          set -euo pipefail
          mkdir -p smoke-output/ardupilot
          curl --fail --location --retry 3 --max-time 45 \
            https://firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu/arducopter \
            --output smoke-output/ardupilot/arducopter
          curl --fail --location --retry 3 --max-time 20 \
            https://firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu/git-version.txt \
            --output smoke-output/ardupilot/git-version.txt
          curl --fail --location --retry 3 --max-time 20 \
            https://raw.githubusercontent.com/ArduPilot/ardupilot/master/Tools/autotest/default_params/copter-heli.parm \
            --output smoke-output/ardupilot/copter-heli.parm
          chmod +x smoke-output/ardupilot/arducopter
          sha256sum smoke-output/ardupilot/arducopter smoke-output/ardupilot/copter-heli.parm | tee smoke-output/ardupilot/sha256.txt
      - name: Connect to isolated ArduPilot conventional helicopter and verify MAVLink
        run: |
          python code/probe_ardupilot_sitl.py \
            --binary smoke-output/ardupilot/arducopter \
            --defaults smoke-output/ardupilot/copter-heli.parm \
            --firmware-metadata smoke-output/ardupilot/git-version.txt \
            --output smoke-output/ardupilot/sitl-telemetry.json
      - name: Try isolated GUIDED arm, takeoff and sampled hover
        run: |
          python code/probe_ardupilot_hover.py \
            --binary smoke-output/ardupilot/arducopter \
            --defaults smoke-output/ardupilot/copter-heli.parm \
            --output smoke-output/ardupilot/guided-hover.json
      - name: Retain executable identity, console logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardupilot-heli-sitl-prevalidation
          path: |
            smoke-output/ardupilot/sha256.txt
            smoke-output/ardupilot/git-version.txt
            smoke-output/ardupilot/sitl-telemetry.json
            smoke-output/ardupilot/sitl-console.log
            smoke-output/ardupilot/guided-hover.json
            smoke-output/ardupilot/sitl-guided-console.log
          retention-days: 7
          if-no-files-found: warn

  ardupilot-compiled-heli-flight:
    # Expensive pinned heli source build: PR and manual only, never scheduled.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: fb773567896014da007bca58358704d4a0d8516f
          submodules: recursive
          path: ardupilot-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pinned upstream SITL build output
        uses: actions/cache@v4
        with:
          path: ardupilot-source/build
          key: ardupilot-heli-sitl-${{ runner.os }}-fb773567896014da007bca58358704d4a0d8516f-v1
      - name: Install pinned research telemetry dependencies
        run: python -m pip install pymavlink==2.4.50 empy==3.3.4 future pyserial pexpect pyyaml
      - name: Configure and compile exact HELI_FRAME ArduCopter target
        working-directory: ardupilot-source
        run: |
          set -euo pipefail
          ./waf configure --board sitl
          ./waf build --target bin/arducopter-heli -j2
          test -x build/sitl/bin/arducopter-heli
      - name: Inspect actual native helicopter build provenance
        run: |
          set -euo pipefail
          mkdir -p smoke-output/ardupilot-heli
          git -C ardupilot-source rev-parse HEAD | tee smoke-output/ardupilot-heli/source-commit.txt
          sha256sum ardupilot-source/build/sitl/bin/arducopter-heli | tee smoke-output/ardupilot-heli/sha256.txt
          cp ardupilot-source/Tools/autotest/default_params/copter-heli.parm smoke-output/ardupilot-heli/copter-heli.parm
          python - <<'PY'
          from pathlib import Path
          source = Path('ardupilot-source/ArduCopter/wscript').read_text()
          assert "program_name='arducopter-heli'" in source
          assert "defines=['FRAME_CONFIG=HELI_FRAME']" in source
          print("source: helicopter-specific FRAME_CONFIG=HELI_FRAME verified")
          PY
      - name: Verify helicopter-specific autopilot frame, telemetry and GPS navigation
        run: |
          python code/probe_ardupilot_sitl.py \
            --binary ardupilot-source/build/sitl/bin/arducopter-heli \
            --defaults smoke-output/ardupilot-heli/copter-heli.parm \
            --firmware-metadata smoke-output/ardupilot-heli/source-commit.txt \
            --output smoke-output/ardupilot-heli/sitl-telemetry.json
      - name: Try actual guided takeoff with HELI_FRAME autopilot
        run: |
          python code/probe_ardupilot_hover.py \
            --binary ardupilot-source/build/sitl/bin/arducopter-heli \
            --defaults smoke-output/ardupilot-heli/copter-heli.parm \
            --output smoke-output/ardupilot-heli/guided-hover.json
      - name: Preserve full flight and negative-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardupilot-native-heli-flight-gate
          path: |
            smoke-output/ardupilot-heli/source-commit.txt
            smoke-output/ardupilot-heli/sha256.txt
            smoke-output/ardupilot-heli/sitl-telemetry.json
            smoke-output/ardupilot-heli/sitl-console.log
            smoke-output/ardupilot-heli/guided-hover.json
            smoke-output/ardupilot-heli/sitl-guided-console.log
          retention-days: 7
          if-no-files-found: warn

  paper:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paper build tools
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils
      - name: Build manuscript scaffold
        working-directory: docs/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Research-Paper.tex
          bibtex Research-Paper
          pdflatex -interaction=nonstopmode -halt-on-error Research-Paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error Research-Paper.tex
      - run: python docs/scripts/check_submission.py --pdf docs/paper/Research-Paper.pdf
